<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kavasam SOS receiver (test)</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--text:#1c1c1a;--sub:#6b6a65;--line:#e4e2dc;--ok:#1a7f4b;--bad:#c62828;--accent:#1a5fb4}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--text:#efeee9;--sub:#a3a199;--line:#33322f;--ok:#5fd08e;--bad:#ff7b72;--accent:#7db3ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif;padding:20px 16px 48px}
  main{max-width:520px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin:8px 0 4px}
  .sub{color:var(--sub);font-size:14px;margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 20px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .chip{font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
  .chip.on{color:var(--ok);border-color:var(--ok)}
  button{font:inherit;font-size:17px;font-weight:600;width:100%;padding:16px;border-radius:12px;border:0;background:var(--accent);color:#fff;margin-top:16px}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500;font-size:15px;padding:12px}
  #alert{display:none;border-radius:16px;padding:28px 20px;margin:0 0 20px;text-align:center;background:var(--bad);color:#fff}
  #alert.show{display:block;animation:fl 0.8s infinite}
  @keyframes fl{50%{opacity:.7}}
  #alert h2{font-size:34px;margin:0 0 8px;letter-spacing:1px}
  #alert p{margin:4px 0;font-size:16px}
  #alert button{background:#fff;color:var(--bad)}
  h3{font-size:15px;margin:0 0 12px;font-weight:600}
  ul{list-style:none;margin:0;padding:0}
  li{padding:12px 0;border-top:1px solid var(--line);font-size:14px;color:var(--sub)}
  li:first-child{border-top:0}
  li b{color:var(--text);font-weight:600}
  #msg{font-size:14px;color:var(--bad);margin:12px 0 0;min-height:1.4em}
  .step{font-size:14px;color:var(--sub);margin:6px 0}
</style>
</head>
<body>
<main>
  <h1>Kavasam SOS receiver</h1>
  <p class="sub">Test page: Node A button → LoRa → Node B → Bluetooth → this phone</p>

  <div id="alert" role="alert">
    <h2>SOS ALERT</h2>
    <p id="aWho"></p>
    <p id="aWhen"></p>
    <p id="aSig"></p>
    <button id="ack">Acknowledge</button>
  </div>

  <div class="card">
    <div class="row"><b>Gateway</b><span id="chip" class="chip">Not connected</span></div>
    <button id="conn">Connect to Kavasam-Gateway</button>
    <p id="msg"></p>
    <p class="step" id="support"></p>
  </div>

  <div class="card">
    <h3>Alert history</h3>
    <ul id="log"><li>No alerts yet.</li></ul>
    <button class="ghost" id="test">Send a test alert (on this phone only)</button>
  </div>
</main>

<script>
const SERVICE = 'a1b2c3d4-0001-4aa0-9c3e-5a0b6f1e0001';
const CHAR    = 'a1b2c3d4-0002-4aa0-9c3e-5a0b6f1e0001';
const $ = id => document.getElementById(id);
let device = null, audio = null, beepTimer = null, wake = null, lastSeq = {}, userDisconnected = false;

function setChip(on, text){ const c = $('chip'); c.textContent = text; c.classList.toggle('on', on); }
function setMsg(t){ $('msg').textContent = t || ''; }

if (!('bluetooth' in navigator)) {
  $('support').textContent = 'This browser has no Web Bluetooth. Use Chrome on Android.';
  $('conn').disabled = true;
} else if (!window.isSecureContext) {
  $('support').textContent = 'Page is not secure (needs https:// or localhost). Bluetooth will not work.';
}

function beep(){
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.25;
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.35);
}

function showAlert(id, seq, rssi){
  $('aWho').textContent = 'From device ' + id + ' · alert #' + seq;
  $('aWhen').textContent = new Date().toLocaleTimeString();
  $('aSig').textContent = 'Signal ' + rssi + ' dBm';
  $('alert').classList.add('show');
  if (navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
  clearInterval(beepTimer); beep(); beepTimer = setInterval(beep, 700);
  const log = $('log');
  if (log.firstElementChild && log.firstElementChild.dataset.empty !== '0') log.innerHTML = '';
  const li = document.createElement('li'); li.dataset.empty = '0';
  li.innerHTML = '<b>SOS from device ' + id + '</b> · #' + seq + '<br>' + new Date().toLocaleString() + ' · ' + rssi + ' dBm';
  log.prepend(li);
  window.scrollTo({top:0, behavior:'smooth'});
}

$('ack').onclick = () => {
  $('alert').classList.remove('show');
  clearInterval(beepTimer);
  if (navigator.vibrate) navigator.vibrate(0);
};

function onData(e){
  const text = new TextDecoder().decode(e.target.value);
  const p = text.split(',');
  if (p[0] !== 'SOS' || p.length < 4) return;
  const id = parseInt(p[1]), seq = parseInt(p[2]), rssi = parseInt(p[3]);
  if (lastSeq[id] === seq) return;
  lastSeq[id] = seq;
  showAlert(id, seq, rssi);
}

async function openGatt(){
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  const ch = await svc.getCharacteristic(CHAR);
  await ch.startNotifications();
  ch.addEventListener('characteristicvaluechanged', onData);
  setChip(true, 'Connected');
  setMsg('');
}

async function reconnectLoop(){
  for (let i = 0; i < 15 && !userDisconnected; i++){
    setChip(false, 'Reconnecting…');
    await new Promise(r => setTimeout(r, 2000));
    try { await openGatt(); return; } catch(e) {}
  }
  setChip(false, 'Not connected');
  setMsg('Lost the gateway. Tap Connect again.');
}

$('conn').onclick = async () => {
  setMsg('');
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') await audio.resume();
    try { wake = await navigator.wakeLock.request('screen'); } catch(e) {}
    userDisconnected = false;
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
    device.addEventListener('gattserverdisconnected', () => { if (!userDisconnected) reconnectLoop(); });
    setChip(false, 'Connecting…');
    await openGatt();
  } catch (e) {
    setChip(false, 'Not connected');
    if (e.name === 'NotFoundError') setMsg('No device chosen, or Kavasam-Gateway was not found. Check Node B is powered and Bluetooth is on.');
    else if (e.name === 'SecurityError' || e.name === 'NotAllowedError') setMsg('Bluetooth blocked: allow Nearby devices / Location for Chrome, and open this page directly in Chrome over https.');
    else setMsg(e.name + ': ' + e.message);
  }
};

$('test').onclick = async () => {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === 'suspended') await audio.resume();
  showAlert(0, Math.floor(Math.random()*900)+100, -30);
};

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wake !== null) {
    try { wake = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
});
</script>
</body>
</html>
